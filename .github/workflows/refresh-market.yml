name: Refresh dashboard market snapshots
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-market-snapshots
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      quotes_updated: ${{ steps.refresh.outputs.quotes_updated }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current market snapshots
        id: refresh
        run: |
          python refresh_market.py
          value=$(python -c "import json; print(json.load(open(\"data.json\"))[\"quotes_updated\"])")
          printf "quotes_updated=%s\\n" "$value" >> "$GITHUB_OUTPUT"
      - name: Validate JSON and publish changed snapshots
        run: |
          python -m json.tool data.json >/dev/null
          python -m json.tool 3-history.json >/dev/null
          python -m json.tool 5-intraday.json >/dev/null
          git config user.name "Instinct Agent"
          git config user.email "instinct-agent@users.noreply.github.com"
          git add data.json 3-history.json 5-intraday.json
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -m "Refresh 30-minute market snapshots"
          git push
  verify-pages:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed Pages quote timestamp
        env:
          EXPECTED: ${{ needs.refresh.outputs.quotes_updated }}
        run: |
          python - <<"PY"
          import json, os, time, urllib.request
          expected = os.environ["EXPECTED"]
          if not expected:
              raise SystemExit("Refresh job did not export quotes_updated")
          base = "https://gilbuch-instinct.github.io/gil-dashboard/data.json"
          for attempt in range(18):
              try:
                  url = base + "?verify=" + str(time.time_ns())
                  req = urllib.request.Request(url, headers={"Cache-Control":"no-cache", "Pragma":"no-cache", "User-Agent":"github-actions-pages-verifier"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.load(response)
                  actual = data.get("quotes_updated", "")
                  print(f"Pages quotes_updated={actual!r}; expected refresh timestamp={expected!r}")
                  if actual == expected:
                      print("Verified deployed data.json reflects this refresh")
                      break
              except Exception as exc:
                  print(f"Pages verification attempt {attempt+1} failed: {exc}")
              if attempt == 17:
                  raise SystemExit(f"Pages data.json failed to advance to {expected!r}")
              time.sleep(20)
          PY
