name: One-off data.json card sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Qeshm confirmation cards into data.json (idempotent)
        run: |
          python3 - <<'PY'
          import json, base64, pathlib
          NEW = json.loads(base64.b64decode("").decode("utf-8"))
          NEW_WSJ = json.loads(base64.b64decode("").decode("utf-8"))
          OLD_TITLE = "AP/CNN: דיווחים על תקיפות הגנתיות; אין הודעה פומבית של CENTCOM"
          WSJ_TITLE = "WSJ: ארה״ב תקפה בקשם; הדיווח אינו אישור רשמי"
          p = pathlib.Path("data.json")
          D = json.loads(p.read_text(encoding="utf-8"))
          u = D["updates"]
          out = []
          insert_at = None
          for c in u:
              t = c.get("title") if isinstance(c, dict) else None
              if t in (OLD_TITLE, NEW["title"]):
                  if insert_at is None:
                      insert_at = len(out)
                  continue
              out.append(c)
          assert insert_at is not None, "no Qeshm AP/CNN card found in updates"
          out.insert(insert_at, NEW)
          wsj = [i for i, c in enumerate(out) if isinstance(c, dict) and c.get("title") == WSJ_TITLE]
          if len(wsj) == 1:
              out[wsj[0]] = NEW_WSJ
          else:
              assert len(wsj) == 0 and any(isinstance(c, dict) and c.get("title") == NEW_WSJ["title"] for c in out), "WSJ card state unexpected"
          D["updates"] = out
          titles = [c.get("title") for c in out if isinstance(c, dict)]
          assert titles.count(NEW["title"]) == 1, "new Qeshm card must appear exactly once"
          assert OLD_TITLE not in titles, "stale Qeshm card must be gone"
          assert titles.count(NEW_WSJ["title"]) == 1, "updated WSJ card must appear exactly once"
          assert WSJ_TITLE not in titles, "stale WSJ card must be gone"
          assert len(out) == len(u) or len(out) == len(u) - 1, "unexpected length change"
          p.write_text(json.dumps(D, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          print("data.json synced: old titles removed, new cards in place")
          PY
      - name: Commit and push
        run: |
          git config user.name 'gil-dashboard-bot'
          git config user.email 'gil-dashboard-bot@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet && echo "no change" || (git commit -m 'Qeshm strike cards: sync Trump confirmation into data.json' && git push)
