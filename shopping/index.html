<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f"><title>הרשימה שלנו | גיל ואילנה</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"><style>
:root{--bg:#07131f;--panel:#0d1e2d;--panel2:#102638;--line:#244259;--text:#f4f8fb;--muted:#9fb3c3;--mint:#43d6a2;--gold:#ffca63;--red:#ff7890;--shadow:0 18px 55px #0007;font-size:16px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 100% 0,#17415a 0,transparent 35%),var(--bg);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 100px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.eyebrow{color:var(--mint);font-weight:800;font-size:.78rem;letter-spacing:.08em}h1{font-size:clamp(1.8rem,8vw,3rem);margin:4px 0 6px;line-height:1}.sub{color:var(--muted);margin:0}.sync{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap;font-size:.82rem}.sync.on{color:var(--mint);border-color:#43d6a266}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#06101a;padding:6px;border-radius:18px;margin:20px 0}.tab{border:0;background:transparent;color:var(--muted);padding:13px;border-radius:13px;font-weight:800;font-size:1rem}.tab.active{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}.card{background:linear-gradient(145deg,#102638ee,#0b1b29ee);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.add{display:grid;grid-template-columns:1fr 74px 54px;gap:8px}input,textarea{width:100%;border:1px solid var(--line);background:#06131f;color:#fff;border-radius:13px;padding:13px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px #43d6a21f}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:13px;background:var(--mint);color:#052219;font-weight:900;font-size:1.35rem}.count{color:var(--muted);font-size:.88rem;margin:14px 2px 8px}.list{display:grid;gap:8px}.empty{text-align:center;color:var(--muted);padding:30px 10px}.item{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;padding:11px;background:#081824;border:1px solid #19364a;border-radius:15px}.item.done .name{text-decoration:line-through;color:#718999}.check,.trash,.smallbtn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:11px;min-height:38px}.check{font-size:1.1rem}.trash{color:var(--red);padding:0 11px}.name{font-weight:800;overflow-wrap:anywhere}.qty{display:inline-block;margin-inline-start:7px;color:var(--gold);font-size:.8rem}.compare{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.compare a{color:#aeddff;border:1px solid #284b65;border-radius:999px;padding:4px 8px;font-size:.72rem;text-decoration:none}.notes h2,.fiction h2{font-size:1.05rem;margin:0 0 10px}.noteform{display:grid;grid-template-columns:1fr 60px;gap:8px}.noteslist{display:grid;gap:8px;margin-top:10px}.note{padding:12px;border-right:3px solid var(--gold);background:#081824;border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:8px;white-space:pre-wrap}.stamp{color:var(--muted);font-size:.72rem;margin-top:5px}.fiction{display:none}.fiction.active,.shared.active{display:block}.shared{display:none}.fiction-grid{display:grid;gap:8px}.fiction-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#081824;border:1px solid #19364a;border-radius:14px;padding:11px}.smallbtn{padding:0 12px;color:var(--mint)}.notice{color:var(--muted);font-size:.8rem;line-height:1.55;margin-top:12px}.a11y{position:fixed;left:12px;top:36%;z-index:10}.a11y-toggle{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#167c9c;color:#fff;font-size:1.4rem;box-shadow:0 8px 30px #0008}.a11y-panel{display:none;background:#fff;color:#09202e;border-radius:14px;padding:9px;margin-top:7px;width:150px;box-shadow:var(--shadow)}.a11y.open .a11y-panel{display:grid;gap:5px}.a11y-panel button{padding:8px;border:1px solid #ccd8df;border-radius:8px;background:#f5f8fa}.high{--bg:#000;--panel:#000;--panel2:#111;--line:#fff;--text:#fff;--muted:#fff;--mint:#00ff94}.links a{text-decoration:underline!important}footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:22px}@media(max-width:460px){.wrap{padding-inline:12px}.add{grid-template-columns:1fr 62px 50px}header{align-items:center}.sync{padding:7px 9px}.card{border-radius:18px;padding:13px}}
</style></head>
<body><div class="wrap">
<header><div><div class="eyebrow">הבית שלנו</div><h1>רשימת קניות</h1><p class="sub">מתעדכנת יחד, בזמן אמת</p></div><div id="sync" class="sync">מתחבר…</div></header>
<nav class="tabs" aria-label="מעבר בין רשימות"><button class="tab active" data-tab="shared">הרשימה שלנו</button><button class="tab" data-tab="fiction">דוגמה למשפחה</button></nav>
<main><section class="shared active" id="shared"><div class="card"><form id="addForm" class="add"><input id="itemName" maxlength="120" required placeholder="מה צריך לקנות?" aria-label="שם המוצר"><input id="itemQty" type="number" min="1" max="99" value="1" aria-label="כמות"><button class="primary" aria-label="הוספה">+</button></form><div class="count" id="count"></div><div class="list" id="list"><div class="empty">טוען את הרשימה…</div></div></div>
<div class="card notes"><h2>פתק לשנינו</h2><form id="noteForm" class="noteform"><textarea id="noteBody" rows="2" maxlength="500" required placeholder="למשל: לקנות חלב ללא לקטוז"></textarea><button class="primary" aria-label="הוספת פתק">+</button></form><div class="noteslist" id="notes"></div></div></section>
<section class="fiction" id="fiction"><div class="card"><h2>רשימה בדיונית למשפחה בת ארבע נפשות</h2><div class="fiction-grid" id="fictionList"></div><p class="notice">זו רשימת דוגמה בלבד. לחיצה על "הוספה" מעתיקה מוצר לרשימה המשותפת.</p></div></section></main>
<footer>השוואת המחירים פותחת חיפוש בכל רשת. המחיר הסופי, המלאי והמשלוח נקבעים באתר הרשת.</footer></div>
<aside class="a11y" id="a11y"><button class="a11y-toggle" aria-label="אפשרויות נגישות" aria-expanded="false">♿</button><div class="a11y-panel"><button data-a="plus">הגדלת טקסט</button><button data-a="contrast">ניגודיות גבוהה</button><button data-a="links">הדגשת קישורים</button><button data-a="reset">איפוס</button></div></aside>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://fzyorujptmsmcuplzmvu.supabase.co',KEY='sb_publishable_48VHcu-494l-DsOhs0S0KA_S3lW5zf3';
var familyStore=supabase.createClient(URL,KEY),$=s=>document.querySelector(s);let items=[],notes=[];
const chains=[['שופרסל','https://www.shufersal.co.il/online/he/search?text='],['טיב טעם','https://tivtaam.co.il/search?q='],['רמי לוי','https://www.rami-levy.co.il/he/online/market/search?q='],['ויקטורי','https://www.victoryonline.co.il/search?q='],['יוחננוף','https://yochananof.co.il/search?q=']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function links(n){return '<div class="compare">'+chains.map(c=>`<a target="_blank" rel="noopener" href="${c[1]+encodeURIComponent(n)}">${c[0]}</a>`).join('')+'</div>'}
function render(){let left=items.filter(x=>!x.checked).length;$('#count').textContent=`${left} מוצרים נותרו · ${items.length} בסך הכול`;$('#list').innerHTML=items.length?items.map(x=>`<div class="item ${x.checked?'done':''}"><button class="check" onclick="toggleItem(${x.id},${!x.checked})" aria-label="${x.checked?'סימון כלא נקנה':'סימון כנקנה'}">${x.checked?'✓':'○'}</button><div><div class="name">${esc(x.name)}<span class="qty">×${x.qty}</span></div>${links(x.name)}</div><button class="trash" onclick="removeItem(${x.id})" aria-label="מחיקת ${esc(x.name)}">×</button></div>`).join(''):'<div class="empty">הרשימה ריקה. אפשר להתחיל להוסיף.</div>';$('#notes').innerHTML=notes.map(n=>`<div class="note"><div>${esc(n.body)}<div class="stamp">${new Date(n.created_at).toLocaleString('he-IL')}</div></div><button class="trash" onclick="removeNote(${n.id})" aria-label="מחיקת פתק">×</button></div>`).join('')}
async function load(){let [a,b]=await Promise.all([familyStore.from('family_items').select('*').order('created_at'),familyStore.from('family_notes').select('*').order('created_at',{ascending:false})]);if(a.error||b.error){$('#sync').textContent='שגיאת חיבור';return}items=a.data;notes=b.data;render();$('#sync').textContent='● מסונכרן';$('#sync').classList.add('on')}
$('#addForm').onsubmit=async e=>{e.preventDefault();let name=$('#itemName').value.trim(),qty=+$('#itemQty').value;if(!name)return;$('#itemName').value='';await familyStore.from('family_items').insert({name,qty});await load()};$('#noteForm').onsubmit=async e=>{e.preventDefault();let body=$('#noteBody').value.trim();if(!body)return;$('#noteBody').value='';await familyStore.from('family_notes').insert({body});await load()};window.toggleItem=async(id,checked)=>{await familyStore.from('family_items').update({checked}).eq('id',id);await load()};window.removeItem=async id=>{await familyStore.from('family_items').delete().eq('id',id);await load()};window.removeNote=async id=>{await familyStore.from('family_notes').delete().eq('id',id);await load()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.shared,.fiction').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});
const sample=['יוגורטים דני','פצפוצים','גבנ״צ (קוטג׳)','הרבה חלב','קפסולות נספרסו','בשר טרי','לחם אחיד','ביצים','מלפפונים','עגבניות','אורז','נייר טואלט'];$('#fictionList').innerHTML=sample.map((n,i)=>`<div class="fiction-row"><div><strong>${n}</strong>${links(n)}</div><button class="smallbtn" onclick="addSample(${i})">הוספה</button></div>`).join('');window.addSample=async i=>{await familyStore.from('family_items').insert({name:sample[i],qty:1});document.querySelector('[data-tab=shared]').click();await load()};
const ch=familyStore.channel('family-live').on('postgres_changes',{event:'*',schema:'public',table:'family_items'},load).on('postgres_changes',{event:'*',schema:'public',table:'family_notes'},load).subscribe(s=>{if(s==='SUBSCRIBED'){$('#sync').textContent='● מסונכרן';$('#sync').classList.add('on')}});load();
const aa=$('#a11y'),toggle=aa.querySelector('.a11y-toggle');toggle.onclick=()=>{aa.classList.toggle('open');toggle.setAttribute('aria-expanded',aa.classList.contains('open'))};aa.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let a=b.dataset.a;if(a==='plus')document.documentElement.style.fontSize=(parseFloat(getComputedStyle(document.documentElement).fontSize)+2)+'px';if(a==='contrast')document.body.classList.toggle('high');if(a==='links')document.body.classList.toggle('links');if(a==='reset'){document.documentElement.style.fontSize='16px';document.body.className=''}});
</script></body></html>
